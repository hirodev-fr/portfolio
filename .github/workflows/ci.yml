name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type checks
        run: bun run typecheck
        env:
            LIBSQL_DATABASE_URL: http://localhost:8080

      - name: Build application
        run: bun run build
        env:
            NODE_ENV: production
            LIBSQL_DATABASE_URL: http://localhost:8080

  cd:
    name: CD
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker tag
        id: date
        run: echo "DATE_STAMP=$(date +%s)" > "$GITHUB_ENV"

      - name: Build and push Docker images
        uses: iloveitaly/github-action-railpack@master
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        with:
            push: true
            env: |
                LIBSQL_DATABASE_URL: http://libsql:8080
            tags: |
                ${{ env.IMAGE_NAME }}:custom-${{ env.DATE_STAMP }}
                ${{ env.IMAGE_NAME }}:latest

      - name: Trigger Dokploy deployment
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.DOKPLOY_API_TOKEN }}
          application_id: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
