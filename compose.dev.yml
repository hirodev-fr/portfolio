services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SQLD_NODE: standalone
      SQLD_DB_PATH: /var/lib/sqld/data.db
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080

    volumes:
      - libsql-data:/var/lib/sqld

volumes:
  libsql-data:
