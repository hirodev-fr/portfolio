services:
  emdash:
    build: .
    ports:
      - '4321:4321'
    volumes:
      - emdash-data:/app/data
    restart: unless-stopped
    environment:
      - EMDASH_ENCRYPTION_KEY=${EMDASH_ENCRYPTION_KEY}
      - IN_BUILD=${IN_BUILD}
      - ALLOW_POLICIES_IN_BUILD=${ALLOW_POLICIES_IN_BUILD}
      - POSTGRES_URL=postgresql://root:root@postgres:5432/portfolio-db
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    platform: linux/amd64
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=portfolio-db
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d portfolio-db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  emdash-data:
  postgres_data:
