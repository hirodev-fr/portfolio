services:
  emdash:
    env_file: ".env"
    build:
        context: .
        args:
          EMDASH_ENCRYPTION_KEY: $EMDASH_ENCRYPTION_KEY
          EMDASH_SITE_URL: $EMDASH_SITE_URL
    ports:
      - "4321:4321"
    volumes:
      - emdash-data:/app/data
    restart: unless-stopped

volumes:
  emdash-data:
