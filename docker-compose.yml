services:
  emdash:
    build: .
    ports:
      - '4321:4321'
    volumes:
      - emdash-data:/app/data
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    image: postgres:18
    platform: linux/amd64
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=portfolio-db
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  emdash-data:
  postgres_data:
